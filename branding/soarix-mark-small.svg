<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512">
  <!-- Simplified Wings mark for 16-32 px icons: fewer details so it stays crisp -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16264a"/><stop offset="1" stop-color="#090e1c"/></linearGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#2bd9b4" stop-opacity=".25"/><stop offset=".4" stop-color="#2bd9b4"/><stop offset="1" stop-color="#6cc0ff"/></linearGradient>
    <path id="swoop" d="M84 416 C146 276 252 168 396 112 L384 170 C262 210 172 304 84 416 Z"/>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#tile)"/>
  <use xlink:href="#swoop" href="#swoop" fill="#4aa8ff" fill-opacity=".55" transform="translate(84 416) rotate(14) scale(.93) translate(-84 -416)"/>
  <use xlink:href="#swoop" href="#swoop" fill="url(#trail)"/>
  <circle cx="394" cy="122" r="42" fill="#ffb84d"/>
</svg>
