# Soarix style for every pop-up menu (settings lists, power menu, store messages).
[main]
font=Noto Sans:size=14
prompt="  "
icon-theme=hicolor
width=44
lines=10
horizontal-pad=26
vertical-pad=20
inner-pad=10
line-height=26
letter-spacing=0
layer=overlay

[colors]
background=0b1426f5
text=c9d4e8ff
prompt=4fb3c8ff
placeholder=6f80a3ff
input=ffffffff
match=ffb84dff
selection=1f4d66ff
selection-text=ffffffff
selection-match=ffb84dff
counter=6f80a3ff
border=c8963eff

[border]
width=2
radius=14
