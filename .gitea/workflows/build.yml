name: Build Soarix
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  image-and-iso:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build container image
        run: sudo podman build --pull=newer -t localhost/soarix:latest .

      - name: Build installer ISO
        run: |
          mkdir -p /opt/soarix-out && sudo rm -rf /opt/soarix-out/*
          sudo image-builder build             --bootc-ref localhost/soarix:latest --bootc-default-fs ext4             --output-dir /opt/soarix-out bootc-generic-iso
          find /opt/soarix-out -name '*.iso' -exec ls -lh {} \; | tee /opt/soarix-out/SIZE.txt
