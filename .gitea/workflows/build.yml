name: Build Soarix
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  image-and-iso:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build container image
        run: sudo podman build --pull=newer -t localhost/soarix:latest .

      - name: Build installer ISO
        run: |
          mkdir -p /opt/soarix-out && rm -rf /opt/soarix-out/*
          sudo podman run --rm --privileged --pull=newer \
            --security-opt label=type:unconfined_t \
            -v "$PWD/disk_config/iso.toml:/config.toml:ro" \
            -v /opt/soarix-out:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type anaconda-iso --rootfs ext4 \
            localhost/soarix:latest
          ls -lh /opt/soarix-out/bootiso/ | tee /opt/soarix-out/SIZE.txt
