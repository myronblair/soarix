# Soarix update settings
#
# CHANNEL: stable (tested releases) or testing (early releases).
CHANNEL=stable
#
# MANIFEST_URL: a small public file that says which Soarix version is current and what
# changed. It holds no operating-system files - only the version, notes and a checksum.
# The OS image itself is fetched by the system updater from its own registry.
MANIFEST_URL=https://raw.githubusercontent.com/myronblair/soarix-updates/main/{channel}.json
